<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {

  --blue: #0071e3;   --blue-hover: #0077ed;
  --green: #34c759;  --red: #ff3b30;   --orange: #ff9500;
  --bg: #f5f5f7;
  --surface: #ffffff;
  --label: #1d1d1f;
  --label-2: #6e6e73;
  --label-3: #86868b;
  --label-4: #a1a1a6;
  --sep: rgba(0, 0, 0, .09);
  --fill: rgba(120, 120, 128, .12);
  --fill-2: rgba(120, 120, 128, .07);
  --radius: 18px;
  --ease: cubic-bezier(.4, 0, .2, 1);
  /* 兼容旧类名 */
  --primary: #1d1d1f; --primary-light: #0071e3; --danger: #ff3b30;
  --success: #34c759; --warning: #ff9500;
}

html { scroll-behavior: smooth; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
               "HelveticaNeue", "Helvetica Neue", "PingFang SC", "Hiragino Sans GB",

  color: var(--label);
  min-height: 100vh;
  font-size: 16px;
  line-height: 1.47;
  letter-spacing: -.022em;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  -webkit-tap-highlight-color: transparent;
}

::selection { background: rgba(0, 113, 227, .18); }

/* === Navigation (Apple 毛玻璃导航条) === */
.nav {
  position: sticky; top: 0; z-index: 100; height: 52px;
  background: rgba(255, 255, 255, .72);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  backdrop-filter: saturate(180%) blur(20px);
  border-bottom: .5px solid var(--sep);
}
.nav-inner {
  max-width: 1100px; margin: 0 auto; height: 100%; padding: 0 22px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px;
}
.nav h1 { font-size: 17px; font-weight: 600; letter-spacing: -.01em; color: var(--label); }

/* Segmented Control */
.nav-tabs { display: flex; background: var(--fill); border-radius: 9px; padding: 2px; }
.nav-tab {
  padding: 5px 15px; border: none; border-radius: 7px; cursor: pointer;
  font-size: 13px; font-weight: 500; background: transparent; color: var(--label);
  font-family: inherit; letter-spacing: -.01em;
  transition: background .24s var(--ease), box-shadow .24s var(--ease), color .24s var(--ease);
}
.nav-tab:hover { color: var(--label); }
.nav-tab.active {
  background: #fff; font-weight: 600;
  box-shadow: 0 3px 8px rgba(0, 0, 0, .12), 0 1px 1px rgba(0, 0, 0, .04);
}
.nav-badge {
  background: var(--red); color: #fff; font-size: 11px; font-weight: 600;
  padding: 1px 7px; border-radius: 980px; margin-left: 6px; vertical-align: 1px;
}

/* === Page layout === */
.page { display: none; min-height: calc(100vh - 52px); }
.page.active { display: block; }
.container { max-width: 720px; margin: 0 auto; padding: 0 22px 80px; }
.container-wide { max-width: 1100px; margin: 0 auto; padding: 0 22px 80px; }

/* Hero 大标题 */
.hero { padding: 64px 8px 26px; text-align: center; }
.hero h2 {
  font-size: 44px; line-height: 1.08; font-weight: 700; letter-spacing: -.022em; color: var(--label);
}
.hero-sm { padding: 40px 8px 22px; }
.hero-sm h2 { font-size: 32px; }

/* === Cards === */
.card {
  background: var(--surface); border-radius: var(--radius); padding: 26px;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 4px 20px rgba(0, 0, 0, .05);
  border: .5px solid rgba(0, 0, 0, .04); margin-bottom: 20px;
}
.card-header {
  font-size: 19px; font-weight: 600; letter-spacing: -.012em; color: var(--label);
  margin-bottom: 20px; padding-bottom: 14px; border-bottom: .5px solid var(--sep);
  display: flex; align-items: center; gap: 8px;
}

/* 分组块（表单内） */
.group { background: var(--fill-2); border-radius: 14px; padding: 18px; margin-bottom: 20px; }
.group-title {
  font-size: 15px; font-weight: 600; color: var(--label); letter-spacing: -.01em;
  display: flex; align-items: center; gap: 7px; margin-bottom: 14px;
}
.group-divider { margin-top: 16px; padding-top: 14px; border-top: .5px solid var(--sep); }

/* 字段栅格（改用 class，便于响应式；内联 grid 无法被媒体查询覆盖） */
.field-grid { display: grid; gap: 12px; }
.field-grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
.field-grid.mt { margin-top: 12px; }

/* === Stats === */
.stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 16px; }
.stat-card {
  background: var(--surface); border-radius: 16px; padding: 22px 14px; text-align: center;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 4px 16px rgba(0, 0, 0, .05);
  border: .5px solid rgba(0, 0, 0, .04);
}
.stat-num {
  font-size: 42px; font-weight: 600; line-height: 1.05; letter-spacing: -.03em;
  font-variant-numeric: tabular-nums;
}
.stat-label { font-size: 13px; color: var(--label-2); margin-top: 8px; letter-spacing: -.01em; }
.stat-card.s1 .stat-num { color: var(--blue); }
.stat-card.s2 .stat-num { color: var(--red); }
.stat-card.s3 .stat-num { color: var(--label); }
.stat-card.s4 .stat-num { color: var(--green); }

/* === Form === */
.form-group { margin-bottom: 18px; }
.form-group label {
  display: block; font-size: 13px; font-weight: 500; color: var(--label-2);
  margin-bottom: 7px; letter-spacing: -.01em;
}
.form-group label .req { color: var(--red); margin-left: 2px; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 11px 14px;
  border: .5px solid rgba(0, 0, 0, .13); border-radius: 11px;
  font-size: 16px; font-family: inherit; color: var(--label); background: #fff;
  letter-spacing: -.01em;
  transition: border-color .2s var(--ease), box-shadow .2s var(--ease);
  -webkit-appearance: none; appearance: none;
}
.form-group select, .toolbar select {
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='11' height='15' viewBox='0 0 11 15'><path d='M1.5 5.5L5.5 9.5L9.5 5.5' stroke='%2386868b' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
  background-repeat: no-repeat; background-position: right 13px center; background-size: 11px 15px;
  padding-right: 36px; cursor: pointer;
}
.form-group input::placeholder, .form-group textarea::placeholder { color: var(--label-4); }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
  outline: none; border-color: var(--blue);
  box-shadow: 0 0 0 4px rgba(0, 113, 227, .14);
}
.form-group textarea { min-height: 130px; resize: vertical; }
.form-group .helper { font-size: 13px; color: var(--label-2); margin-top: 7px; }

/* 提交成功提示 */
.hint-ok {
  background: rgba(52, 199, 89, .1); border: .5px solid rgba(52, 199, 89, .3);
  border-radius: 12px; padding: 13px 16px; margin-bottom: 18px;
  color: #0a7d33; font-size: 14px;
}

/* 结算进展文字编辑器（Apple Notes 风格） */
.record-editor {
  border: .5px solid rgba(0, 0, 0, .13); border-radius: 12px; background: #fff;
  font-size: 16px; padding: 2px 14px;
}
.record-line {
  display: flex; flex-wrap: wrap; align-items: baseline;
  border-bottom: .5px solid var(--sep); padding: 5px 0;
}
.record-line:last-child { border-bottom: none; }
.record-tmpl { color: var(--label-3); user-select: none; pointer-events: none; white-space: nowrap; font-weight: 500; }
.record-user {
  flex: 1; min-width: 140px; outline: none; min-height: 1.7em; margin-left: 6px;
  background: transparent; color: var(--label); border: none;
}
.record-user:empty::before { content: '（请填写）'; color: var(--label-4); }

/* === Buttons === */
.btn {
  display: inline-block; padding: 12px 26px; border: none; border-radius: 980px;
  font-size: 16px; font-weight: 500; font-family: inherit; letter-spacing: -.01em;
  cursor: pointer; transition: background .2s var(--ease), opacity .2s var(--ease), transform .1s var(--ease);
}
.btn-block { display: block; width: 100%; border-radius: 14px; padding: 15px; font-weight: 500; }
.btn-primary { background: var(--blue); color: #fff; }
.btn-primary:hover { background: var(--blue-hover); }
.btn-primary:active { transform: scale(.99); opacity: .9; }
.btn-primary:disabled { opacity: .4; cursor: not-allowed; transform: none; }
.btn-success { background: var(--green); color: #fff; }
.btn-success:hover { background: #30b350; }
.btn-danger { background: var(--red); color: #fff; }
.btn-outline { background: var(--fill); color: var(--blue); }
.btn-outline:hover { background: rgba(120, 120, 128, .18); }
.btn-sm { padding: 7px 15px; font-size: 14px; border-radius: 980px; }
.btn:disabled { opacity: .4; cursor: not-allowed; transform: none; box-shadow: none; }

/* === Toast === */
.toast {
  position: fixed; top: 74px; left: 50%; transform: translateX(-50%);
  padding: 12px 24px; border-radius: 980px; color: #fff; font-size: 15px; font-weight: 500;
  z-index: 9999; display: none; background: rgba(0, 0, 0, .8);
  -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  box-shadow: 0 8px 30px rgba(0, 0, 0, .18);
  animation: toastIn .32s var(--ease);
}
@keyframes toastIn {
  from { opacity: 0; transform: translateX(-50%) translateY(-14px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}
.toast.success { background: rgba(52, 199, 89, .94); }
.toast.error { background: rgba(255, 59, 48, .94); }
.toast.info { background: rgba(0, 113, 227, .94); }

/* === Table === */
.toolbar { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; align-items: center; }
.toolbar select {
  padding: 7px 34px 7px 15px; border-radius: 980px; border: none;
  font-size: 14px; background-color: var(--fill); color: var(--label); font-family: inherit;
}
.table-wrap {
  overflow-x: auto; border-radius: 14px; border: .5px solid var(--sep);
  box-shadow: 0 1px 2px rgba(0, 0, 0, .04);
}
table { width: 100%; border-collapse: collapse; background: #fff; min-width: 900px; table-layout: fixed; }
th {
  background: rgba(120, 120, 128, .06); padding: 11px 12px; text-align: left;
  font-size: 12px; font-weight: 600; color: var(--label-2);
  border-bottom: .5px solid var(--sep); white-space: normal; word-break: break-all;
  line-height: 1.4; letter-spacing: 0;
}
td { padding: 12px; font-size: 14px; border-bottom: .5px solid var(--sep); color: var(--label); }
tr:last-child td { border-bottom: none; }
tr:hover td { background: rgba(120, 120, 128, .05); }
.cell-record { white-space: pre-wrap; word-break: break-all; line-height: 1.6; color: var(--label-2); }
.cell-name { white-space: normal; word-break: break-all; line-height: 1.6; }
.badge { display: inline-block; padding: 3px 10px; border-radius: 980px; font-size: 12px; font-weight: 600; }
.badge-ok { background: rgba(52, 199, 89, .14); color: #0a7d33; }
.badge-warn { background: rgba(255, 149, 0, .16); color: #b25000; }
.badge-no { background: rgba(255, 59, 48, .13); color: #c0281f; }
.badge-gray { background: var(--fill); color: var(--label-2); }
.week-auto-banner {
  background: var(--fill-2); border: .5px solid var(--sep); color: var(--label-2);
  padding: 12px 16px; border-radius: 12px; margin-bottom: 18px; font-size: 13px;
}

/* === Empty state === */
.empty { text-align: center; padding: 56px 20px; color: var(--label-3); }
.empty .empty-icon { font-size: 44px; margin-bottom: 12px; }

/* === Progress bar === */
.progress-bar { height: 6px; background: var(--fill); border-radius: 980px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--blue); border-radius: 980px; transition: width .6s var(--ease); }

/* === Manager list in dashboard === */
.mgr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px; }
.mgr-card {
  background: #fff; border-radius: 12px; padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between;
  border: .5px solid var(--sep);
}
.mgr-card .mgr-name { font-weight: 500; font-size: 15px; }
.mgr-card .mgr-status { font-size: 12px; }
.mgr-card.done { border-left: 3px solid var(--green); }
.mgr-card.undone { border-left: 3px solid var(--orange); }

/* === Password gate === */
.pwd-area {
  max-width: 400px; margin: 72px auto; background: #fff; border-radius: 20px;
  padding: 44px 34px; text-align: center;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 8px 30px rgba(0, 0, 0, .06);
}
.pwd-icon { font-size: 44px; margin-bottom: 14px; }
.pwd-area h2 { font-size: 26px; font-weight: 600; letter-spacing: -.015em; color: var(--label); margin-bottom: 6px; }
.pwd-area p { color: var(--label-2); font-size: 14px; margin-bottom: 8px; }
.pwd-area input {
  width: 100%; padding: 13px 16px; border: .5px solid rgba(0, 0, 0, .14); border-radius: 12px;
  font-size: 16px; font-family: inherit; text-align: center; letter-spacing: 4px;
  margin: 20px 0 18px; background: #fff; color: var(--label);
}
.pwd-area input:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 4px rgba(0, 113, 227, .14); }

/* === Responsive === */
@media (max-width: 768px) {
  .stats-row { grid-template-columns: repeat(2, 1fr); }
  .mgr-grid { grid-template-columns: 1fr; }
  .nav-inner { padding: 0 16px; gap: 10px; }
  .nav h1 { font-size: 15px; }
  .nav-tab { padding: 5px 11px; font-size: 12px; }
  .hero { padding: 40px 4px 20px; }
  .hero h2 { font-size: 32px; }
  .card { padding: 20px; }
  .container, .container-wide { padding-left: 16px; padding-right: 16px; }
  .btn-block { border-radius: 14px; }
  /* 表单字段：平板 2 列 */
  .field-grid.cols-3 { grid-template-columns: repeat(2, 1fr); }
  .group { padding: 15px; }
  /* 明细表多了一列，放宽最小宽度保证可读（横向滚动） */
  table { min-width: 1000px; }
  .toolbar { gap: 10px; }
  .toolbar .btn-sm { padding: 9px 14px; }
}
@media (max-width: 480px) {
  /* 手机：字段单列，避免挤压 */
  .field-grid.cols-3 { grid-template-columns: 1fr; }
  .card { padding: 16px; }
  .hero h2 { font-size: 26px; }
  .toolbar .btn-sm { flex: 1 1 auto; text-align: center; }
}

/* 细滚动条 */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, .18); border-radius: 980px; border: 3px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: rgba(0, 0, 0, .3); background-clip: content-box; }
::-webkit-scrollbar-track { background: transparent; }

/* 云端状态条 */
.cloud-bar { margin-top: 8px; }
.cloud-status { font-size: 12px; color: var(--label-3); }
.cloud-status.offline { color: var(--red); }
</style>
</head>

/* ===== data.js 内联（部署网关仅放行根路径，子路径 .js 会被 403，故内联此文件） ===== */
/* ==================== 云端数据区（数据存于 jsonbin.io，前端只读拉取） ==================== */
const MAX_MANAGERS = 50;
const MAX_PROJECTS = 300;

const CLOUD = {
  base: 'https://api.jsonbin.io/v3/b',
  binId: '6a9fa5a2ac6210605ab2485f'
};

let REPORT_MANAGERS = [];
let REPORT_PROJECTS = [];
let SETTLE_DATA = {};
let CLOUD_UPDATED_AT = '';
let CLOUD_LOADED = false;
let CLOUD_LOADING = false;

function applyCloudData(rec) {
  rec = rec || {};
  REPORT_MANAGERS = (rec.managers || [])
    .map(function (x) { return String(x == null ? '' : x).trim(); })
    .filter(Boolean)
    .slice(0, MAX_MANAGERS);
  REPORT_PROJECTS = (rec.projects || [])
    .filter(function (p) { return p && p.s && String(p.s).trim() && p.n && String(p.n).trim(); })
    .map(function (p) {
      return {
        s: String(p.s).trim(),
        n: String(p.n).trim(),
        m: (p.m == null ? '' : String(p.m)).trim(),
        leader: (p.leader == null ? '' : String(p.leader)).trim()
      };
    })
    .slice(0, MAX_PROJECTS);
  SETTLE_DATA = (rec.settle && typeof rec.settle === 'object') ? rec.settle : {};
  CLOUD_UPDATED_AT = rec.updatedAt || '';
  CLOUD_LOADED = true;
}

async function loadCloudData() {
  if (CLOUD_LOADING) return;
  CLOUD_LOADING = true;
  try {
    const url = CLOUD.base + '/' + CLOUD.binId + '?t=' + Date.now();
    const r = await fetch(url, { cache: 'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const j = await r.json();
    applyCloudData(j.record || {});
    saveCloudCache(j.record || {});
    return j.record;
  } finally {
    CLOUD_LOADING = false;
  }
}

/* ============ 本地缓存 + 内置快照：页面打开即生效，免去云端加载等待 ============
   1) localStorage 缓存：每次成功拉取云端后写入，回头客打开即用「上次成功的数据」，零等待。
   2) 内置静态快照：仅用于首次访问 / 清缓存的用户兜底，确保下拉框立刻有内容，随后由云端刷新覆盖。 */
const CLOUD_CACHE_KEY = 'hnSettleCloudCache_v1';
function saveCloudCache(rec) {
  try {
    if (!rec) return;
    localStorage.setItem(CLOUD_CACHE_KEY, JSON.stringify({
      managers: rec.managers || [],
      projects: rec.projects || [],
      settle: rec.settle || {},
      updatedAt: rec.updatedAt || ''
    }));
  } catch (e) { /* 隐私模式等写入失败，忽略即可 */ }
}
function loadCloudCache() {
  try {
    const s = localStorage.getItem(CLOUD_CACHE_KEY);
    if (!s) return null;
    const o = JSON.parse(s);
    if (!o || !Array.isArray(o.managers) || !o.managers.length) return null;
    return o;
  } catch (e) { return null; }
}

function fetchWithTimeout(url, opts, ms) {

  const o = Object.assign({}, opts || {});
  if (ctl) o.signal = ctl.signal;

async function loadSubmissions() {

    /* 读取「直连 jsonbin」，优先级：
       1) 带密钥的 /latest —— 返回最新版本，避免「公开读」的秒级滞后（写完后立刻能看到）
       2) 公开 GET —— 无需密钥的兜底（该 bin public:false，公开可读）
       （Worker 已停用，url 为空时自动跳过；日后启用可再加回）
       全程不经过 workers.dev。写入为前端直连 jsonbin 的 read-modify-write。 */
    const sources = [];
    if (CLOUD_SUB.secret) {
      sources.push({
        tag: 'jsonbin/latest(密钥)',
        url: CLOUD_SUB.base + '/' + CLOUD_SUB.binId + '/latest?t=' + Date.now(),
        headers: { 'X-Master-Key': CLOUD_SUB.secret }
      });
    }
    sources.push({ tag: 'jsonbin公开读', url: CLOUD_SUB.base + '/' + CLOUD_SUB.binId + '?t=' + Date.now(), headers: null });
    if (WORKER.url) {
      sources.push({ tag: 'Worker', url: WORKER.url.replace(/\/$/, '') + '/sub?t=' + Date.now(), headers: null });
    }
    let arr = null, lastErr = null;
    for (let i = 0; i < sources.length; i++) {
      const s = sources[i];
      try {
        const opt = { cache: 'no-store' };
        if (s.headers) opt.headers = s.headers;
        const r = await fetchWithTimeout(s.url, opt, 15000);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const j = await r.json();
        /* jsonbin 返回 {record:{submissions:[...]}}；Worker 返回 {submissions:[...]} */
        const rec = (j && j.record) ? j.record : j;
        arr = (rec && Array.isArray(rec.submissions)) ? rec.submissions : [];
        break;
      } catch (e) {
        lastErr = e;
        console.warn('loadSubmissions 源失败(' + sources[i].tag + ')', e);
      }
    }
    if (arr === null) throw (lastErr || new Error('读取失败'));
    /* 保护：若上次已知有提交而这次读到空，判定为读取异常，不覆盖内存副本 */
    if (arr.length === 0 && CLOUD_SUBS.length > 0) {

    }

    CLOUD_SUBS_LOADED = true;
  } catch (e) {
    console.warn('loadSubmissions failed', e);

/* 提交写入：read-modify-write 必须保证「读成功才写」。
   历史上存在两个致命缺陷，此处均已修正：
   1) 读取失败时按空数组处理 → PUT 只写自己一条 → 清空全员历史提交
   2) 并发提交时后写覆盖先写，先提交者静默丢失
   修正：读失败即中止并重试（最多 3 次）；每次重试都重新读取最新全量；
        写入前校验条数，异常则拒绝写入；失败保留本地待同步队列。 */
/* 读取云端「最新全量」。有密钥时用 /latest（即时、权威）；无密钥时才退公开 GET。
   ⚠️ 写入前的读取必须用最新版本：公开读有秒级滞后，若拿它做 read-modify-write，
      后提交者会用「不含前人新提交」的旧快照回写，从而覆盖丢失他人记录（已实测复现）。 */
async function fetchCloudSubsLatest() {
  const useKey = !!CLOUD_SUB.secret;
  const url = CLOUD_SUB.base + '/' + CLOUD_SUB.binId + (useKey ? '/latest' : '') + '?t=' + Date.now();
  const opt = { cache: 'no-store' };
  if (useKey) opt.headers = { 'X-Master-Key': CLOUD_SUB.secret };
  const r = await fetchWithTimeout(url, opt, 15000);
  if (!r.ok) throw new Error('读取失败 HTTP ' + r.status);
  const j = await r.json();
  const rec = (j && j.record) ? j.record : j;
  return (rec && Array.isArray(rec.submissions)) ? rec.submissions : [];
}

async function pushSubmission(rec, wk) {
  const k = wk + '|' + (rec.manager || '') + '|' + (rec.shortName || '');
  const entry = Object.assign({}, rec, { wk: wk, _k: k, syncedAt: Date.now() });

  /* 走代理：由 Worker 拿着密钥完成读改写，前端全程不接触密钥 */
  if (WORKER.url) {
    try {
      const r = await fetchWithTimeout(WORKER.url.replace(/\/$/, '') + '/sub', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ rec: rec, wk: wk })
      }, 20000);
      const j = await r.json().catch(function () { return {}; });
      if (!r.ok || !j.ok) throw new Error((j && j.error) || ('HTTP ' + r.status));
      const e = j.entry || entry;
      CLOUD_SUBS = CLOUD_SUBS.filter(function (x) { return (x._k || '') !== k; });
      CLOUD_SUBS.push(e);
      CLOUD_SUBS_LOADED = true;
      markSynced(k, rec.ts);
      return e;
    } catch (e) {
      markPendingSync(k, entry);
      throw e;
    }
  }

  let lastErr = null;

  const keyOf = x => (x._k || ((x.wk || '') + '|' + (x.manager || '') + '|' + (x.shortName || '')));

  for (let attempt = 1; attempt <= 3; attempt++) {
    try {
      /* 步骤 1：读取当前【最新】全量（带密钥 /latest，即时）。
         ⚠️ 绝不能用滞后的公开读，否则会覆盖丢失他人的新提交。
         读不到就绝不能写。 */
      const arr = (await fetchCloudSubsLatest()).slice();

      /* 步骤 2：异常保护 —— 已知有提交却读到空，说明读取有问题，拒绝写入 */
      if (arr.length === 0 && CLOUD_SUBS.length > 0) {
        throw new Error('云端读取异常（返回 0 条），已中止写入以保护历史数据');
      }

      /* 步骤 3：定位并替换/追加 */
      const idx = arr.findIndex(x => keyOf(x) === k);
      if (idx >= 0) arr[idx] = entry; else arr.push(entry);

      /* 步骤 4：写回 */
      const r = await fetchWithTimeout(CLOUD_SUB.base + '/' + CLOUD_SUB.binId, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'X-Master-Key': CLOUD_SUB.secret },
        body: JSON.stringify({ submissions: arr })
      }, 20000);
      if (!r.ok) throw new Error('写入失败 HTTP ' + r.status);

      /* 步骤 5：写后回读校验 —— 确认自己那条确实落库（并发时可能被他人后写覆盖）。
         若不在，抛错触发重试：重试会重新读取最新全量再合并，从而补回丢失的记录。 */
      if (CLOUD_SUB.secret) {
        const back = await fetchCloudSubsLatest();
        if (!back.some(x => keyOf(x) === k)) {
          throw new Error('写入校验未通过（与他人并发提交冲突），将重试合并');
        }
      }

      CLOUD_SUBS = arr;
      CLOUD_SUBS_LOADED = true;
      markSynced(k, entry.ts);
      return entry;
    } catch (e) {
      lastErr = e;
      if (attempt < 3) {
        await new Promise(function (res) { setTimeout(res, 800 * attempt); });
      }
    }
  }
  /* 三次都失败：记录待同步，本地数据仍然完整，后续可一键重传 */
  markPendingSync(k, entry);
  throw lastErr || new Error('云端同步失败');
}

const LS_PENDING = 'hn_settle_pending_v1';
const LS_HISTORY = 'hn_settle_history_v1';

function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) { return fallback; }
}
function saveJSON(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); }
  catch (e) { console.warn(e); }
}
function markPendingSync(k, entry) {
  const q = loadJSON(LS_PENDING, {});
  q[k] = entry;
  saveJSON(LS_PENDING, q);
}
function markSynced(k, ts) {
  const q = loadJSON(LS_PENDING, {});
  if (q[k]) { delete q[k]; saveJSON(LS_PENDING, q); }
}
function pendingCount() {
  return Object.keys(loadJSON(LS_PENDING, {})).length;
}
/* 保留提交历史快照（仅本地，最多 60 条），用于误覆盖时找回 */
function pushHistory(rec, k) {
  const h = loadJSON(LS_HISTORY, []);
  h.unshift({ k: k, ts: rec.ts, rec: rec, savedAt: Date.now() });
  saveJSON(LS_HISTORY, h.slice(0, 60));
}
/* 重传所有待同步记录 */
async function retryPendingSync() {
  const q = loadJSON(LS_PENDING, {});
  const keys = Object.keys(q);
  if (!keys.length) return 0;
  let ok = 0;
  for (const k of keys) {
    const e = q[k];
    try {
      await pushSubmission(e, e.wk || weekKey(new Date(e.ts || Date.now())));
      ok++;
    } catch (err) { /* 保留在队列，下次再试 */ }
  }
  return ok;
}

/* 看板口令：页面内仅保存 PBKDF2-SHA256(口令, 随机盐, 210000 次) 的派生值，
   不含任何明文口令。修改口令需重新生成 _PS / _PH / _PN 三个常量。 */
const _PS = '3137d297bceed08a9f1b7ff326529cfa';   // 16 字节随机盐
const _PH = '9fdc4969e95f9c0989dc14ce77b57abf53325bb106c31e5ea8b6fb962954b0a1';
const _PN = 210000;                                // 迭代次数

function _toHex(buf) {
  return Array.prototype.map.call(new Uint8Array(buf), function (b) {
    return ('0' + b.toString(16)).slice(-2);
  }).join('');
}
async function _derive(pwd) {
  const salt = Uint8Array.from(_PS.match(/../g).map(function (h) { return parseInt(h, 16); }));
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pwd), 'PBKDF2', false, ['deriveBits']);
  return _toHex(await crypto.subtle.deriveBits(
    { name: 'PBKDF2', salt: salt, iterations: _PN, hash: 'SHA-256' }, base, 256));

  const a = await _derive(pwd);
  let diff = a.length ^ _PH.length;
  for (let i = 0; i < a.length; i++) diff |= a.charCodeAt(i) ^ _PH.charCodeAt(i);

/* 以周一为一周起点 */
function mondayOf(d) {
  const x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const w = x.getDay();            // 0=周日
  x.setDate(x.getDate() - ((w + 6) % 7));
  return x;
}
function weekKey(d) {
  const m = mondayOf(d);
  return m.getFullYear() + '-' + String(m.getMonth() + 1).padStart(2, '0') + '-' + String(m.getDate()).padStart(2, '0');
}
function weekLabel(key, markCurrent) {
  const [y, m, d] = key.split('-').map(Number);
  const mon = new Date(y, m - 1, d);
  const sun = new Date(y, m - 1, d + 6);
  const f = x => (x.getMonth() + 1) + '/' + x.getDate();
  const isCur = key === weekKey(new Date());
  return y + '年 ' + f(mon) + ' — ' + f(sun) + (markCurrent !== false && isCur ? '（本周）' : '');
}
function fmtDate(s) {
  if (!s) return '';

  return p[0] + '-' + p[1] + '-' + p[2];
}
function fmtTime(ts) {

function mergedWeeks() {

      e.preventDefault();
      const txt = (e.clipboardData || window.clipboardData).getData('text/plain');
      document.execCommand('insertText', false, txt.replace(/\s*\n\s*/g, ' '));
    });
    /* 标记该行被用户编辑过：被编辑过的行即使清空也不再沿用上次内容 */
    el.addEventListener('input', () => {
      el.dataset.touched = '1';
      saveDraft();
    });
  });

  /* 表单任意输入都自动存草稿，手机端误关页面不丢内容 */
  ['managerName', 'projectShortName', 'projectStatus', 'stlLeader', 'stlRequiredDate',
   'stlUrgeDate', 'stlMethod', 'stlTargetAmount', 'stlEstCost', 'stlTargetBenefit']
    .forEach(function (id) {
      const el = document.getElementById(id);
      if (!el) return;
      el.addEventListener('change', saveDraft);
      el.addEventListener('input', saveDraft);
    });

  document.getElementById('collectForm').addEventListener('submit', onSubmit);
  scheduleCloudAutoRefresh();
}

function populateManagerSelect() {
  const mgrSel = document.getElementById('managerName');
  const prev = mgrSel ? mgrSel.value : '';
  mgrSel.innerHTML = '<option value="">请选择你的姓名</option>';
  REPORT_MANAGERS.forEach(m => {
    const o = document.createElement('option');
    o.value = m; o.textContent = m;
    mgrSel.appendChild(o);
  });
  /* 云端刷新后重建下拉时，尽量保留用户已选的姓名，避免误清空 */
  if (prev && Array.from(mgrSel.options).some(o => o.value === prev)) mgrSel.value = prev;
}

function onManagerSelect() {
  const mgr = document.getElementById('managerName').value;
  const pSel = document.getElementById('projectShortName');
  pSel.innerHTML = '<option value="">请选择项目简称</option>';
  document.getElementById('statusFields').style.display = 'none';
  document.getElementById('settlementFields').style.display = 'none';
  document.getElementById('projectFullName').style.display = 'none';
  document.getElementById('submittedHint').style.display = 'none';
  currentProject = null;
  if (!mgr) { pSel.innerHTML = '<option value="">请先选择项目经理</option>'; return; }

  const list = REPORT_PROJECTS.filter(p => p.m === mgr);
  list.forEach(p => {
    const o = document.createElement('option');
    o.value = p.s;
    const inList = !!SETTLE_DATA[p.s];
    o.textContent = p.s + (inList ? '　【清单内】' : '');
    pSel.appendChild(o);
  });
}

function onProjectSelect() {
  const shortName = document.getElementById('projectShortName').value;
  const manager = document.getElementById('managerName').value;
  currentProject = REPORT_PROJECTS.find(p => p.s === shortName) || null;
  const fullEl = document.getElementById('projectFullName');
  if (!currentProject) {
    document.getElementById('statusFields').style.display = 'none';
    document.getElementById('settlementFields').style.display = 'none';
    fullEl.style.display = 'none';
    return;
  }
  fullEl.textContent = '📌 ' + currentProject.n;
  fullEl.style.display = 'block';
  document.getElementById('statusFields').style.display = 'block';
  document.getElementById('projectStatus').value = '';
  document.getElementById('settlementFields').style.display = 'none';
  document.getElementById('urgeFields').style.display = 'none';

  // 预填结算数据（清单内项目自动带出，清单外留空）
  const pre = SETTLE_DATA[shortName];
  document.getElementById('stlLeader').value =
    (currentProject.leader || (pre && pre.leader) || '');
  document.getElementById('stlRequiredDate').value = pre && pre.required_date ? pre.required_date : '';
  document.getElementById('stlUrgeDate').value = pre && pre.urge_date ? pre.urge_date : '';
  document.getElementById('stlMethod').value = pre && pre.method ? pre.method : '';
  document.getElementById('stlTargetAmount').value = pre && pre.target_amount != null ? Number(pre.target_amount).toFixed(2) : '';
  document.getElementById('stlEstCost').value = pre && pre.est_cost != null ? Number(pre.est_cost).toFixed(2) : '';
  document.getElementById('stlTargetBenefit').value = pre && pre.target_benefit != null ? Number(pre.target_benefit).toFixed(2) : '';

  /* 回填上次提交内容，让用户看得见（原先清空后提交时静默继承，用户无从察觉） */
  const filled = fillEditorFromLast(manager, shortName);
  const hint = document.getElementById('editorHint');
  if (hint) {
    if (filled) {
      hint.textContent = '↑ 已带入本项目上次提交内容，可直接修改；清空某行即表示本次不再填写。';
      hint.style.display = 'block';
      hint.className = 'helper';
    } else {
      hint.style.display = 'none';
    }
  }
  showSubmittedHint(false);
  saveDraft();
}

/* 用上次提交内容填充编辑器；返回是否填到了内容 */
function fillEditorFromLast(manager, shortName) {
  clearEditor();
  const prev = lastRecordOf(manager, shortName);
  const fields = document.querySelectorAll('#settleEditor .record-user');
  fields.forEach(function (el) { el.dataset.touched = ''; });
  if (!prev || !prev.lines) return false;
  let any = false;
  fields.forEach(function (el) {
    const t = prev.lines[Number(el.dataset.line)] || '';
    el.textContent = t;
    if (t) any = true;
  });
  return any;
}

function onStatusChange() {
  const st = document.getElementById('projectStatus').value;
  document.getElementById('settlementFields').style.display = st ? 'block' : 'none';
  document.getElementById('urgeFields').style.display = st ? 'block' : 'none';
}

function clearEditor() {
  document.querySelectorAll('#settleEditor .record-user').forEach(el => { el.textContent = ''; });
}

function readEditor() {
  const lines = [];
  document.querySelectorAll('#settleEditor .record-user').forEach(el => {
    lines[Number(el.dataset.line)] = (el.textContent || '').replace(/\s+/g, ' ').trim();
  });
  return lines;
}

function editorToText(lines) {
  return [
    '本周结算进展：' + (lines[1] || ''),
    '下周结算计划：' + (lines[2] || ''),
    '目前存在的问题：' + (lines[3] || ''),
    '需分公司/公司协调事项：' + (lines[4] || ''),
    '本周对接的“甲方人员”：' + (lines[5] || '')
  ].filter(s => !s.endsWith('：')).join('\n');
}

function showSubmittedHint(show, text) {
  const el = document.getElementById('submittedHint');
  el.style.display = show ? 'block' : 'none';
  if (show) document.getElementById('submittedTime').textContent = text;
}

function onSubmit(e) {
  e.preventDefault();
  const manager = document.getElementById('managerName').value;
  const shortName = document.getElementById('projectShortName').value;
  const status = document.getElementById('projectStatus').value;
  if (!manager) return showToast('请选择项目经理', 'error');
  if (!shortName) return showToast('请选择项目简称', 'error');
  if (!status) return showToast('请选择项目状态', 'error');

  let lines = readEditor();
  const prev = lastRecordOf(manager, shortName);
  /* 仅对「用户未编辑过」且为空的行沿用上次内容。
     修正：原先不区分是否被编辑，用户主动清空的行也会被静默填回旧内容。 */
  if (prev && prev.lines) {
    for (let i = 1; i <= SETTLE_LINES; i++) {
      const el = document.querySelector('#settleEditor .record-user[data-line="' + i + '"]');
      const touched = el && el.dataset.touched === '1';
      if (!touched && !lines[i] && prev.lines[i]) lines[i] = prev.lines[i];
    }
  }
  if (!lines.some(t => t)) return showToast('请至少填写一行结算进展文字', 'error');

  const num = id => {
    const v = document.getElementById(id).value;
    return v === '' ? null : Number(v);
  };

  /* 必填校验：这些字段在界面上标了 *，但原先 onSubmit 完全不校验，可以提交空值 */
  const requiredDate = document.getElementById('stlRequiredDate').value;
  const methodVal = document.getElementById('stlMethod').value.trim();
  const amtV = num('stlTargetAmount');
  const costV = num('stlEstCost');
  const benV = num('stlTargetBenefit');
  if (!requiredDate) return showToast('请填写「要求完成结算时间」', 'error');
  if (!methodVal) return showToast('请填写「结算方式」', 'error');
  if (amtV == null || isNaN(amtV)) return showToast('请填写「目标结算额」', 'error');
  if (costV == null || isNaN(costV)) return showToast('请填写「预估总成本」', 'error');
  if (benV == null || isNaN(benV)) return showToast('请填写「目标效益」', 'error');
  if (amtV < 0 || costV < 0) return showToast('金额不能为负数', 'error');

  /* 覆盖已有提交时二次确认 */
  const store0 = loadStore();
  const wkNow = weekKey(new Date());
  const already = (store0.weeks[wkNow] || []).some(r => r.manager === manager && r.shortName === shortName);
  if (already && !confirm('本项目本周已提交过，再次提交将覆盖原记录。\n确认要覆盖吗？')) return;

  const rec = {
    manager,
    shortName,
    projectName: currentProject ? currentProject.n : '',
    leader: document.getElementById('stlLeader').value.trim(),
    status,
    requiredDate: requiredDate,
    urgeDate: document.getElementById('stlUrgeDate').value,
    method: methodVal,
    targetAmount: amtV,
    estCost: costV,
    targetBenefit: benV,
    lines,
    record: editorToText(lines),
    ts: Date.now()
  };

  const store = loadStore();
  const key = weekKey(new Date());
  if (!store.weeks[key]) store.weeks[key] = [];
  const idx = store.weeks[key].findIndex(r => r.manager === manager && r.shortName === shortName);
  if (idx >= 0) store.weeks[key][idx] = rec; else store.weeks[key].push(rec);
  saveStore(store);

  /* 保留历史快照（仅本地），覆盖后仍可找回 */
  pushHistory(rec, manager + '|' + shortName + '|' + key);
  clearDraft();

  // 同步到云端提交 bin（独立 bin，公开可读；写入用受限密钥），便于统一汇总
  pushSubmission(rec, key).then(function () {
    if (dashOK) loadDashboard();
    updatePendingBadge();
    updateCloudStatus();
    showToast('提交成功（已同步云端）', 'success');
  }).catch(function (err) {
    showToast('云端同步失败（本地已保存，可稍后点「重试同步」）：' + (err && err.message ? err.message : err), 'error');
    updateCloudStatus();
  });

  showSubmittedHint(true, '本项目本周结算进展已提交（' + fmtTime(rec.ts) + '），如需修改可直接改后再次提交覆盖。');
  showToast('已保存，正在同步云端…', 'success');
  updatePendingBadge();
  // 回填合并后的文字
  document.querySelectorAll('#settleEditor .record-user').forEach(el => {
    el.textContent = lines[Number(el.dataset.line)] || '';
    el.dataset.touched = '';
  });
}

/* ===== 草稿自动保存（手机端误关页面不丢内容） ===== */
const LS_DRAFT = 'hn_settle_draft_v1';

function saveDraft() {
  const d = {
    manager: document.getElementById('managerName').value,
    shortName: document.getElementById('projectShortName').value,
    status: document.getElementById('projectStatus').value,
    leader: document.getElementById('stlLeader').value,
    requiredDate: document.getElementById('stlRequiredDate').value,
    urgeDate: document.getElementById('stlUrgeDate').value,
    method: document.getElementById('stlMethod').value,
    targetAmount: document.getElementById('stlTargetAmount').value,
    estCost: document.getElementById('stlEstCost').value,
    targetBenefit: document.getElementById('stlTargetBenefit').value,
    lines: readEditor(),
    at: Date.now()
  };
  /* 全空就不存，避免无意义的草稿 */
  const hasContent = d.manager || d.shortName || (d.lines && d.lines.some(t => t));
  if (!hasContent) { clearDraft(); return; }
  saveJSON(LS_DRAFT, d);
  showDraftHint(true, d.at);
}
function clearDraft() {
  try { localStorage.removeItem(LS_DRAFT); } catch (e) {}
  showDraftHint(false);
}
function loadDraft() {
  return loadJSON(LS_DRAFT, null);
}
function showDraftHint(show, at) {
  const el = document.getElementById('draftHint');
  if (!el) return;
  if (show && at) {
    el.textContent = '草稿已自动保存（' + fmtTime(at) + '），下次打开会自动恢复。';
    el.style.display = 'block';
  } else {
    el.style.display = 'none';
  }
}
/* 恢复草稿：需要在云端数据加载完成后调用（项目列表已填充） */
function restoreDraft() {
  const d = loadDraft();
  if (!d || !d.manager) return false;
  const mSel = document.getElementById('managerName');
  if (!Array.from(mSel.options).some(o => o.value === d.manager)) return false;
  mSel.value = d.manager;
  onManagerSelect();
  const pSel = document.getElementById('projectShortName');
  if (d.shortName && Array.from(pSel.options).some(o => o.value === d.shortName)) {
    pSel.value = d.shortName;
    onProjectSelect();
  }
  if (d.status) {
    document.getElementById('projectStatus').value = d.status;
    onStatusChange();
  }
  const set = (id, v) => { if (v !== undefined && v !== null && v !== '') document.getElementById(id).value = v; };
  set('stlLeader', d.leader);
  set('stlRequiredDate', d.requiredDate);
  set('stlUrgeDate', d.urgeDate);
  set('stlMethod', d.method);
  set('stlTargetAmount', d.targetAmount);
  set('stlEstCost', d.estCost);
  set('stlTargetBenefit', d.targetBenefit);
  if (d.lines) {
    document.querySelectorAll('#settleEditor .record-user').forEach(el => {
      const t = d.lines[Number(el.dataset.line)] || '';
      el.textContent = t;
      if (t) el.dataset.touched = '1';
    });
  }
  showDraftHint(true, d.at);
  return true;
}

function updatePendingBadge() {
  const recs = currentWeekRecords();
  const done = new Set(recs.map(r => r.manager));
  const pending = REPORT_MANAGERS.length - done.size;
  const b = document.getElementById('navPendingCount');
  b.textContent = pending > 0 ? pending : '';
  b.style.display = pending > 0 ? 'inline-block' : 'none';
}

/* ========== 云端刷新 ========== */
let _refreshingCloud = false;
async function refreshCloud() {
  if (_refreshingCloud) return;
  _refreshingCloud = true;
  const btn = document.getElementById('btnRefreshCloud');
  const old = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = '🔄 刷新中…'; }
  try {
    await loadCloudData();
    await loadSubmissions();
    populateManagerSelect();
    loadDashboard();
    updatePendingBadge();
    updateCloudStatus();
    const t = CLOUD_UPDATED_AT ? '（云端更新于 ' + fmtTime(new Date(CLOUD_UPDATED_AT).getTime()) + '）' : '';
    showToast('云端数据已刷新' + t, 'success');
  } catch (e) {
    showToast('云端刷新失败：' + (e && e.message ? e.message : e), 'error');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = old; }
    _refreshingCloud = false;
  }
}

function updateCloudStatus() {
  const el = document.getElementById('cloudStatus');
  if (!el) return;
  if (CLOUD_LOADED) {
    const t = CLOUD_UPDATED_AT ? fmtTime(new Date(CLOUD_UPDATED_AT).getTime()) : '未知时间';
    const sub = CLOUD_SUBS_LOADED ? ('　｜　提交 ' + CLOUD_SUBS.length + ' 条（含全员）') : '';
    const pend = pendingCount();
    const pTxt = pend ? ('　｜　⚠️ ' + pend + ' 条待补传') : '';
    el.textContent = '☁️ 云端更新：' + t + sub + pTxt;
    el.className = 'cloud-status' + (pend ? ' offline' : '');
  } else {
    el.textContent = '☁️ 未连接云端';
    el.className = 'cloud-status offline';
  }
}

/* 每日 18:00（本地时间）自动重新拉取云端数据，与后台每日同步互补 */
let _cloudTimer = null;
function scheduleCloudAutoRefresh() {
  if (_cloudTimer) clearTimeout(_cloudTimer);
  const now = new Date();
  const next = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 18, 0, 5, 0);
  if (next <= now) next.setDate(next.getDate() + 1);
  _cloudTimer = setTimeout(async function () {
    try {
      await loadCloudData();
      await loadSubmissions();
      populateManagerSelect();
      loadDashboard();
      updatePendingBadge();
      updateCloudStatus();
    } catch (e) { /* 静默失败，下次再试 */ }
    scheduleCloudAutoRefresh();
  }, next - now);
}

/* ========== 看板 ========== */
let dashOK = false;

async function checkPwd() {
  const el = document.getElementById('pwdInput');
  const btn = document.querySelector('#pwdGate .btn');
  if (!(window.crypto && crypto.subtle)) {
    showToast('当前环境不支持安全校验，请通过 https 或本地服务访问', 'error');
    return;
  }
  if (btn) { btn.disabled = true; btn.textContent = '校验中...'; }
  let ok = false;
  try { ok = await _verifyPwd(el.value); } catch (e) { ok = false; }
  if (btn) { btn.disabled = false; btn.textContent = '进入看板'; }
  if (ok) {
    dashOK = true;
    el.value = '';
    document.getElementById('pwdGate').style.display = 'none';
    document.getElementById('dashContent').style.display = '';
    loadDashboard();
  } else {
    showToast('密码错误', 'error');
    el.select();
  }
}

function weekOptions() {
  const store = { weeks: mergedWeeks() };
  const keys = Object.keys(store.weeks || {}).sort().reverse();
  const cur = weekKey(new Date());
  if (!keys.includes(cur)) keys.unshift(cur);
  return keys;
}

function loadDashboard() {
  if (!dashOK) return;
  const store = { weeks: mergedWeeks() };
  const sel = document.getElementById('weekSelector');
  const prev = sel.value;
  sel.innerHTML = '';
  const keys = weekOptions();
  keys.forEach(k => {
    const o = document.createElement('option');
    o.value = k;
    o.textContent = weekLabel(k);
    sel.appendChild(o);
  });
  sel.value = keys.includes(prev) ? prev : weekKey(new Date());
  const key = sel.value;
  const recs = (store.weeks[key] || []).slice().sort((a, b) => (a.manager > b.manager ? 1 : -1));

  const doneSet = new Set(recs.map(r => r.manager));
  const total = REPORT_MANAGERS.length;
  const done = REPORT_MANAGERS.filter(m => doneSet.has(m)).length;
  const pending = total - done;
  const rate = total ? Math.round(done / total * 100) : 0;
  document.getElementById('statSubmitted').textContent = done;
  document.getElementById('statPending').textContent = pending;
  document.getElementById('statTotal').textContent = total;
  document.getElementById('statRate').textContent = rate + '%';
  document.getElementById('progressFill').style.width = rate + '%';

  const banner = document.getElementById('weekAutoBanner');
  banner.style.display = 'block';
  banner.textContent = '📅 当前查看：' + weekLabel(key) + '　｜　本周共 ' + recs.length + ' 条结算进展记录，涉及 ' + done + ' 位项目经理。';

  // 经理卡片
  const grid = document.getElementById('mgrGrid');
  grid.innerHTML = '';
  REPORT_MANAGERS.forEach(m => {
    const ok = doneSet.has(m);
    const n = recs.filter(r => r.manager === m).length;
    const d = document.createElement('div');
    d.className = 'mgr-card ' + (ok ? 'done' : 'undone');
    d.innerHTML = '<span class="mgr-name">' + m + '</span><span class="mgr-status badge ' +
      (ok ? 'badge-ok">✅ 已提交 ' + n + ' 项' : 'badge-no">⏳ 待提交') + '</span>';
    grid.appendChild(d);
  });

  // 明细表
  const tb = document.getElementById('detailTable');
  tb.innerHTML = '';
  if (!recs.length) {
    tb.innerHTML = '<tr><td colspan="14"><div class="empty"><div class="empty-icon">📭</div>本周暂无结算进展提交记录</div></td></tr>';
    return;
  }
  recs.forEach((r, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML =
      '<td>' + (i + 1) + '</td>' +
      '<td class="cell-name">' + esc(r.manager) + '</td>' +
      '<td class="cell-name">' + esc(r.shortName) + '</td>' +
      '<td class="cell-name">' + esc(r.projectName) + '</td>' +
      '<td class="cell-name">' + esc(r.leader || '') + '</td>' +
      '<td>' + statusBadge(r.status) + '</td>' +
      '<td>' + esc(fmtDate(r.requiredDate)) + '</td>' +
      '<td>' + esc(fmtDate(r.urgeDate)) + '</td>' +
      '<td>' + esc(r.method || '') + '</td>' +
      '<td>' + fmt2(r.targetAmount) + '</td>' +
      '<td>' + fmt2(r.estCost) + '</td>' +
      '<td>' + fmt2(r.targetBenefit) + '</td>' +
      '<td class="cell-record">' + esc(r.record || '') + '</td>' +
      '<td>' + fmtTime(r.ts) + '</td>';
    tb.appendChild(tr);
  });
}

function statusBadge(s) {
  const map = { '完工未结': 'badge-warn', '阶段结算': 'badge-warn', '完工已结': 'badge-ok', '在建': 'badge-gray' };
  return '<span class="badge ' + (map[s] || 'badge-gray') + '">' + esc(s || '-') + '</span>';
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

/* ========== 导出 / 备份 ========== */
function currentTableRows() {
  const key = document.getElementById('weekSelector').value || weekKey(new Date());
  const store = { weeks: mergedWeeks() };
  const recs = (store.weeks[key] || []).slice().sort((a, b) => (a.manager > b.manager ? 1 : -1));
  const rows = [['#', '项目经理', '项目简称', '项目名称', '包保领导', '项目状态', '要求完成结算时间', '催办结算时间', '结算方式',
    '目标结算额(不含税,万)', '预估总成本(不含税,万)', '目标效益(不含税,万)',
    '本周结算进展', '下周结算计划', '目前存在的问题', '需分公司/公司协调事项', '本周对接的“甲方人员”', '提交时间']];
  recs.forEach((r, i) => {
    const l = r.lines || [];
    rows.push([i + 1, r.manager, r.shortName, r.projectName, r.leader || '', r.status, r.requiredDate, r.urgeDate || '', r.method,
      fmt2(r.targetAmount), fmt2(r.estCost), fmt2(r.targetBenefit),
      l[1] || '', l[2] || '', l[3] || '', l[4] || '', l[5] || '', fmtTime(r.ts)]);
  });
  return { key, rows };
}

function exportExcel() {
  const { key, rows } = currentTableRows();
  if (rows.length <= 1) return showToast('本周暂无数据可导出', 'error');
  /* Excel 组件依赖 CDN，若被墙或未加载完成，降级导出 CSV（Excel 可直接打开） */
  if (typeof XLSX === 'undefined') {
    return exportCSV(rows, key);
  }
  const ws = XLSX.utils.aoa_to_sheet(rows);
  ws['!cols'] = [{ wch: 5 }, { wch: 10 }, { wch: 14 }, { wch: 40 }, { wch: 10 }, { wch: 10 }, { wch: 16 }, { wch: 16 }, { wch: 12 },
    { wch: 18 }, { wch: 18 }, { wch: 16 }, { wch: 50 }, { wch: 40 }, { wch: 40 }, { wch: 40 }, { wch: 24 }, { wch: 18 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '结算进展');
  XLSX.writeFile(wb, '华南结算进展_' + key + '.xlsx');
  showToast('已导出 Excel', 'success');
}

/* CSV 兜底导出：不依赖任何外部库，带 BOM 以保证 Excel 中文不乱码 */
function exportCSV(rows, key) {
  const esc = v => {
    const s = (v == null ? '' : String(v));
    return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const csv = rows.map(r => r.map(esc).join(',')).join('\r\n');
  const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '华南结算进展_' + key + '.csv';
  a.click();
  showToast('Excel 组件不可用，已导出 CSV（可直接用 Excel 打开）', 'success');
}

/* 重试同步：补传因网络问题未成功写入云端的提交 */
async function retrySyncUI() {
  const btn = document.getElementById('btnRetrySync');
  const n = pendingCount();
  if (!n) {
    /* 队列为空时，把本地记录全量重推一次，确保云端与本地一致 */
    if (!confirm('当前没有待补传记录。\n是否把本机所有本地提交重新推送到云端（以较新者为准）？')) return;
    if (btn) { btn.disabled = true; btn.textContent = '同步中…'; }
    try {
      const store = loadStore();
      let ok = 0, fail = 0;
      for (const wk of Object.keys(store.weeks || {})) {
        for (const r of (store.weeks[wk] || [])) {
          try { await pushSubmission(r, wk); ok++; } catch (e) { fail++; }
        }
      }
      showToast('补传完成：成功 ' + ok + ' 条' + (fail ? '，失败 ' + fail + ' 条' : ''), fail ? 'error' : 'success');
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = '🔁 重试同步'; }
    }
    return;
  }
  if (btn) { btn.disabled = true; btn.textContent = '补传中…'; }
  try {
    const ok = await retryPendingSync();
    showToast(ok ? ('已补传 ' + ok + ' 条') : '补传失败，请检查网络后重试', ok ? 'success' : 'error');
    if (dashOK) loadDashboard();
    updateCloudStatus();
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '🔁 重试同步'; }
  }
}

function exportBackup() {
  const blob = new Blob([JSON.stringify(loadStore(), null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '结算进展备份_' + new Date().toISOString().slice(0, 10) + '.json';
  a.click();
  showToast('备份已导出', 'success');
}

function importBackup(files) {
  if (!files || !files.length) return;
  const fr = new FileReader();
  fr.onload = () => {
    try {
      const obj = JSON.parse(fr.result);
      if (!obj || typeof obj !== 'object' || !obj.weeks) throw new Error('格式不正确');
      const cur = loadStore();
      Object.keys(obj.weeks).forEach(k => {
        cur.weeks[k] = (cur.weeks[k] || []).concat(obj.weeks[k] || []);
      });
      saveStore(cur);
      loadDashboard();
      showToast('备份已导入', 'success');
    } catch (e) { showToast('导入失败：' + e.message, 'error'); }
  };
  fr.readAsText(files[0]);
}

function resetWeek() {
  /* 该函数原本叫「新周重置」，实际并不清空任何数据，只是确保本周 key 存在。
     现改名为「切到本周」并修正提示文案，避免误以为会清数据。 */
  const key = weekKey(new Date());
  const store = loadStore();
  const had = !!store.weeks[key];
  if (!store.weeks[key]) store.weeks[key] = [];
  saveStore(store);
  loadDashboard();
  showToast(had ? '已切回本周：' + weekLabel(key) : '已切到本周：' + weekLabel(key) + '（历史数据均保留）', 'success');
}
